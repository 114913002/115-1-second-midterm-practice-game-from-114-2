<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>喵汪搶答大賽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 手寫字體：芫荽 Iansui、霞鶩文楷 TC（皆為 Google Fonts 繁體手寫風字體） -->
<link href="https://fonts.googleapis.com/css2?family=Iansui&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a3520;--paper:rgba(255,251,236,.94);--dog:#4f9be0;--cat:#ef7aa6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Iansui','LXGW WenKai TC','DFKai-SB','BiauKai','標楷體',cursive;color:var(--ink);background:#bfe3f5}
#bg{position:fixed;inset:0;z-index:0}
#bg svg{width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
.hidden{display:none!important}
.screen{position:fixed;inset:0;z-index:5;overflow:auto;padding:12px}

/* 手繪紙卡 */
.card{background:var(--paper);border:3px solid #6b4f2a;border-radius:20px 26px 18px 28px/26px 18px 28px 20px;box-shadow:4px 6px 0 rgba(90,60,20,.35)}
button{font-family:inherit;color:var(--ink);cursor:pointer}

/* 開始畫面 */
#start{display:flex;align-items:center;justify-content:center}
#start .card{max-width:760px;width:100%;padding:22px 28px;text-align:center}
#start h1{margin:0 0 6px;font-size:clamp(34px,6vw,56px);letter-spacing:4px}
#start .pair{display:flex;justify-content:center;gap:40px;margin:4px 0}
#start .pair .avatar{width:150px;height:165px}
#start ul{text-align:left;margin:8px auto;max-width:560px;line-height:1.7;font-size:clamp(16px,2.2vw,21px);padding-left:24px}
.bigbtn{font-size:clamp(22px,3vw,30px);padding:10px 36px;margin-top:8px;background:#ffd54a;border:3px solid #6b4f2a;border-radius:30px 24px 32px 22px;box-shadow:3px 5px 0 rgba(90,60,20,.45);transition:transform .1s}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(90,60,20,.45)}
.bigbtn:disabled{opacity:.5}
#bankInfo{font-size:15px;opacity:.8;min-height:22px}

/* 遊戲畫面 */
#game{display:flex;flex-direction:column;gap:8px}
.topbar{align-self:center;padding:4px 22px;font-size:clamp(18px,2.4vw,26px)}
.board{flex:1;display:grid;grid-template-columns:200px 1fr 200px;gap:12px;min-height:0;align-items:stretch}
.player{padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;transition:box-shadow .25s,opacity .25s}
.player.turn{box-shadow:0 0 0 6px #ffd54a,4px 6px 0 rgba(90,60,20,.35)}
.player.dim{opacity:.7}
.pname{font-size:clamp(20px,2.6vw,28px);font-weight:700}
.avatar{width:150px;height:165px;transition:transform .45s cubic-bezier(.3,1.7,.5,1);margin:14px 0 6px;position:relative;z-index:2}
.avatar svg{width:100%;height:100%;overflow:visible}
.avatar.win{transform:scale(1.4) translateY(-6px)}
.avatar.sad{transform:translateY(8px) rotate(-3deg) scale(.95)}
.score{font-size:clamp(30px,4vw,46px);font-weight:700;transition:transform .2s}
.score.pop{transform:scale(1.35)}
.score small{font-size:.5em}
.float{position:absolute;top:36%;left:50%;transform:translateX(-50%);font-size:44px;font-weight:700;z-index:6;animation:fl 1.2s ease-out forwards;pointer-events:none}
.float.plus{color:#2e9b3f}.float.minus{color:#d6453d}
@keyframes fl{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-80px)}}
.buzz{width:100%;padding:16px 4px;font-size:clamp(22px,3vw,30px);font-weight:700;border:3px solid #5a3d1c;border-radius:50px 40px 48px 42px;color:#fff;text-shadow:1px 2px 0 rgba(0,0,0,.35);box-shadow:0 6px 0 rgba(60,40,10,.5);transition:transform .08s,box-shadow .08s}
.buzz small{display:block;font-size:.5em;font-weight:400;opacity:.9}
.dog .buzz{background:var(--dog)}.cat .buzz{background:var(--cat)}
.buzz:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 rgba(60,40,10,.5)}
.buzz:disabled{filter:grayscale(.8) brightness(1.1);opacity:.55}

.center{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.timer{padding:6px 14px;display:flex;align-items:center;gap:12px}
.timerNum{font-size:clamp(26px,3.6vw,38px);font-weight:700;min-width:96px;text-align:center}
.bar{flex:1;height:18px;border:2px solid #6b4f2a;border-radius:12px;overflow:hidden;background:#f1e5c0}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7fcf6b,#f2c94c);transition:width .12s linear}
.timer.warn .bar i{background:linear-gradient(90deg,#f0794d,#d6453d)}
.timer.warn .timerNum{color:#d6453d;animation:shake .5s infinite}
@keyframes shake{50%{transform:scale(1.12)}}
.qcard{flex:1;padding:14px 18px;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.status{font-size:clamp(17px,2.2vw,23px);text-align:center;padding:4px 10px;border-radius:14px;background:#fff1b8;border:2px dashed #b88a2a}
.status.good{background:#c9f0c2;border-color:#3a9a3a}
.status.bad{background:#ffd2cc;border-color:#d6453d}
.qtext{font-size:clamp(20px,2.7vw,30px);line-height:1.55;font-weight:700}
#qimg{max-width:100%;max-height:230px;align-self:center;background:#fff;border:2px solid #cbb98a}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 14px;font-size:clamp(17px,2.3vw,25px);line-height:1.35;background:#fffdf3;border:3px solid #6b4f2a;border-radius:16px 20px 14px 22px;box-shadow:2px 4px 0 rgba(90,60,20,.3);min-height:56px}
.opt b{flex:none;width:36px;height:36px;border-radius:50%;background:#ffe08a;border:2px solid #6b4f2a;display:flex;align-items:center;justify-content:center}
.opt img{max-width:100%;max-height:120px;background:#fff}
.opts.locked .opt{pointer-events:none;opacity:.78}
.opt.wrong{background:#ffc9c2;text-decoration:line-through;pointer-events:none}
.opt.correct{background:#bdeeb4;border-color:#2e9b3f}
.hint{padding:8px 12px;font-size:clamp(16px,2.1vw,22px);background:#e6f3ff;border:2px dashed #4f9be0;border-radius:14px}
.nextRow{text-align:center}

/* 結算 */
#end{display:flex;align-items:center;justify-content:center}
#end .card{max-width:760px;width:100%;padding:18px 22px;text-align:center}
#end h2{margin:0 0 6px;font-size:clamp(28px,4.5vw,44px)}
.final{display:flex;justify-content:center;gap:50px;margin:2px 0 6px}
.final div{font-size:clamp(20px,3vw,30px)}
.final .avatar{width:110px;height:120px;margin:0 auto}
.final b{font-size:1.5em}
.scrollWrap{position:relative;width:min(560px,92%);margin:10px auto 6px;cursor:pointer}
.roll{height:42px;border-radius:21px;background:linear-gradient(#b27a3d,#e4b772 45%,#b27a3d);border:3px solid #6b4f2a;position:relative;z-index:2}
.roll::before,.roll::after{content:"";position:absolute;top:-4px;bottom:-4px;width:16px;background:#7a4a1f;border:3px solid #4a2d10;border-radius:8px}
.roll::before{left:-12px}.roll::after{right:-12px}
.paper{max-height:0;overflow:hidden;margin:0 14px;background:#fbf0cf;border-left:3px solid #c9a766;border-right:3px solid #c9a766;transition:max-height 1.1s ease}
.scrollWrap.open .paper{max-height:520px}
.pc{padding:12px 10px 18px;opacity:0;transition:opacity .6s .8s}
.scrollWrap.open .pc{opacity:1}
.pc .avatar{width:130px;height:145px;margin:10px auto 6px}
.pc .crown{font-size:38px}
.pc .wname{font-size:clamp(28px,4.4vw,44px);font-weight:700}
.pc .congrats{margin-top:8px;font-size:clamp(22px,3.4vw,32px);color:#c0392b;font-weight:700}
.ribbon{position:absolute;left:50%;top:0;bottom:0;width:30px;transform:translateX(-50%);background:#d6453d;border:3px solid #8f2a22;z-index:3;border-radius:6px;transition:opacity .4s}
.scrollWrap.open .ribbon{opacity:0;pointer-events:none}
.tap{font-size:20px;margin-top:6px;animation:shake 1.2s infinite}
.scrollWrap.open + .tap{display:none}

/* 頭像表情 */
.av .e-open,.av .e-happy,.av .e-sad,.av .m-smile,.av .m-open,.av .m-sad{display:none}
.av[data-s="normal"] .e-open,.av[data-s="normal"] .m-smile{display:block}
.av[data-s="normal"] .e-open{animation:idle 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes idle{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.av[data-s="win"] .e-open{display:block;animation:bA .7s infinite}
.av[data-s="win"] .e-happy{display:block;animation:bB .7s infinite}
.av[data-s="win"] .m-open{display:block}
@keyframes bA{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
@keyframes bB{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.av[data-s="sad"] .e-sad,.av[data-s="sad"] .m-sad{display:block}
.av .tear{animation:tear 1.2s infinite}
@keyframes tear{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(22px);opacity:0}}

@media (max-width:820px){
  .board{grid-template-columns:1fr 1fr;grid-template-areas:"dog cat" "center center";grid-template-rows:auto 1fr}
  #pl-dog{grid-area:dog}#pl-cat{grid-area:cat}.center{grid-area:center}
  .player{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:2px 8px;padding:6px}
  .avatar{width:84px;height:94px;margin:8px 0 0}
  .buzz{padding:10px 4px}
  .opts{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- 共用濾鏡：水彩、色鉛筆紋理 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="water" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.9"/>
    </filter>
    <filter id="waterLite" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
    </filter>
    <filter id="pencil" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="2" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="5"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0" intercept="0.16"/></feComponentTransfer>
    </filter>
  </defs>
</svg>

<div id="bg"></div>
<canvas id="fx"></canvas>

<!-- 開始畫面 -->
<div id="start" class="screen">
  <div class="card">
    <h1>🐶 喵汪搶答大賽 🐱</h1>
    <div class="pair"><div class="avatar" id="av-s-dog"></div><div class="avatar" id="av-s-cat"></div></div>
    <ul>
      <li>兩位同學共用一台平板：<b>小狗</b>在左、<b>小貓</b>在右。</li>
      <li>題目出現後，<b>先按「搶答」</b>的人才有作答權。</li>
      <li>答對 <b>+1 分</b>；答錯 <b>−1 分</b>（分數可以是負的），只給提示、不給答案，換另一位作答。</li>
      <li>每題 <b>90 秒</b>，兩人都沒作答則都 0 分。共 <b>20 題</b>，最後比出贏家！</li>
    </ul>
    <div id="bankInfo">題庫載入中…</div>
    <button class="bigbtn" id="startBtn" disabled>開始遊戲</button>
  </div>
</div>

<!-- 遊戲畫面 -->
<div id="game" class="screen hidden">
  <div class="topbar card">第 <span id="qn">1</span> / <span id="qt">20</span> 題</div>
  <div class="board">
    <aside class="player card dog" id="pl-dog">
      <div class="pname">🐶 小狗</div>
      <div class="avatar" id="av-dog"></div>
      <div class="score"><span id="sc-dog">0</span><small> 分</small></div>
      <button class="buzz" id="bz-dog">搶答！<small>（A 鍵）</small></button>
    </aside>

    <main class="center">
      <div class="timer card" id="timer"><div class="timerNum" id="timerNum">⏱ 90</div><div class="bar"><i id="barI"></i></div></div>
      <div class="qcard card">
        <div class="status" id="status"></div>
        <div class="qtext" id="qtext"></div>
        <img id="qimg" class="hidden" alt="題目附圖">
        <div class="opts locked" id="opts"></div>
        <div class="hint hidden" id="hint"></div>
        <div class="nextRow"><button class="bigbtn hidden" id="nextBtn">下一題 ▶</button></div>
      </div>
    </main>

    <aside class="player card cat" id="pl-cat">
      <div class="pname">🐱 小貓</div>
      <div class="avatar" id="av-cat"></div>
      <div class="score"><span id="sc-cat">0</span><small> 分</small></div>
      <button class="buzz" id="bz-cat">搶答！<small>（L 鍵）</small></button>
    </aside>
  </div>
</div>

<!-- 結算畫面 -->
<div id="end" class="screen hidden">
  <div class="card">
    <h2>🎉 比賽結束！</h2>
    <div class="final">
      <div><div class="avatar" id="av-e-dog"></div>🐶 小狗<br><b id="fs-dog">0</b> 分</div>
      <div><div class="avatar" id="av-e-cat"></div>🐱 小貓<br><b id="fs-cat">0</b> 分</div>
    </div>
    <div class="scrollWrap" id="scroll">
      <div class="roll"></div>
      <div class="paper"><div class="pc" id="pc"></div></div>
      <div class="roll"></div>
      <div class="ribbon"></div>
    </div>
    <div class="tap" id="tapHint">👆 點擊卷軸，揭曉贏家！</div>
    <button class="bigbtn" id="againBtn">再玩一次</button>
  </div>
</div>

<script>
/* ===================================================================
   題庫：取自附檔 Word（第二次段考、CH4-3、CH3-3~3-4 隨堂進階卷、CH4-3~4-5 平時卷）
   格式：Q(編號, 題目, [四個選項], 正解索引(0=A), 提示)
   有圖題目：把原檔圖片放在 img/ 資料夾（檔名需與下方相同），圖片會原樣顯示，不做任何修改。
   圖片不存在的題目會自動略過，不會出錯。
   =================================================================== */
const IMG_DIR = 'img/';
const Q = (id,q,o,a,h)=>({id,q,o,a,h});
const ALL = [
  /* ---- 有原圖的題目（圖檔名稱依 Word 內標示）---- */
  {id:'E1', q:'冠宇手握繩子1、2、3、4依序上下擺動（如附圖），使繩波向右前進，若按手部上下擺動的順序，則該繩波之波形為何？',
   img:'Y8B012U-3-6.jpg', optImgs:['Y8B012U-3-6A.jpg','Y8B012U-3-6B.jpg','Y8B012U-3-6C.jpg','Y8B012U-3-6D.jpg'], a:2,
   h:'波向右傳，右邊的點比較晚開始振動；依手部擺動的先後順序，推想每個點接下來往哪個方向動。'},
  {id:'E12', q:'如附圖所示，週期波的頻率為2次／秒，波形從A位置到B位置所需的時間為下列何者？',
   img:'Y8B012U-3-4.jpg', o:['0.75秒','2秒','3秒','3.25秒'], a:0,
   h:'先由頻率求出週期，再數一數圖中 A 到 B 共走了幾個波長。'},

  /* ---- 第二次段考 ---- */
  Q('E2','甲物體以振動頻率1500赫茲發出聲音，強度為80分貝，乙物體以振動頻率6000赫茲發出聲音，強度為50分貝，哪一物體發出的聲音傳播較遠？',['甲','乙','兩者一樣遠','無法判斷'],0,'聲音傳得遠或近，和「響度（分貝）」有關，不是音調高低。'),
  Q('E4','身高180cm的冠名站在太陽下影子長為60cm，請問同時同地身高150cm的冠宇影子長度為？',['25cm','50cm','100cm','無法判斷'],1,'同一時間、同一地點，身高與影長成正比。'),
  Q('E8','已知黃光是由紅光及綠光混合而成，今有一物體只能吸收紅光而將其餘色光反射，則此物體以黃光照射時，人眼會看見什麼顏色？',['紅色','綠色','黃色','黑色'],1,'黃光裡有哪些色光？物體吸收哪一種？剩下被反射進眼睛的就是看到的顏色。'),
  Q('E9','有一個物體放在凸透鏡前，並在鏡後的紙屏得到一個清晰的像，若將透鏡的上半部用不透光的物體遮住，則紙屏上的像會如何？',['不變','亮度變小，但像的大小不變','像的大小變為一半，但亮度不變','亮度變小，且像的大小也變為原來的一半'],1,'想想：像的位置與大小由什麼決定？通過透鏡的光線變少了，會影響什麼？'),
  Q('E10','已知一繩波的波速為20公分／秒，若此繩波每分鐘振動120次，則下列敘述何者正確？',['繩波的頻率為120赫茲','繩波的頻率為2次／秒','繩波的週期為1秒','繩波的波長為5公分'],1,'頻率是「每秒」的次數，要先把每分鐘換算成每秒；波長＝波速÷頻率。'),
  Q('E11','有關實驗室中的透鏡（單獨一片），下列敘述何者正確？',['不管產生實像、虛像，原物體愈靠近凸透鏡焦點時，像愈大','產生實像與原物體比較，不一定為倒立','物體愈靠近凹透鏡時，產生的像愈小，比原物體小','產生的虛像比物體大'],0,'回想凸透鏡成像規律：物體越靠近焦點，像的大小怎麼變？凹透鏡的像又有什麼特性？'),
  Q('E13','船以固定20公尺／秒的速度遠離海岸邊的山壁，鳴笛4秒後船上的船員聽到山壁傳來的回聲，已知聲速為340公尺／秒，則鳴笛時船和山壁的距離為多少公尺？',['1440','1280','720','640'],3,'聲音走的路程＝（原本的距離）＋（聲音回到船時，船與山壁的距離）。船在這4秒內也走了一段。'),
  Q('E15','光由水進入空氣中時，下列哪些現象不會發生？(甲)光速減慢；(乙)波長變長；(丙)頻率不變；(丁)同時有反射和折射現象；(戊)入射角大於折射角；(己)入射角大於反射角。',['乙丙','乙丁','甲丁戊','甲戊己'],3,'光從水（較慢）進入空氣（較快）：速率、折射角、波長怎麼變？別忘了反射定律。'),
  Q('E16','有一直升機距水面60公尺高，它向下發出聲波偵測水面下潛水艇的蹤跡，經0.6秒後接收到回聲，此時潛水艇約在水面下多少公尺深處？（聲音在空氣中與水中的速率分別為300m／s與1500m／s）',['960','720','360','150'],3,'先算聲波在空氣中「來回」花的時間，剩下的時間才是在水中來回的時間。'),

/* ===================== 音效（Web Audio，簡單提示音）===================== */
let AC=null;
function tone(f,d,type='sine',v=.15,delay=0){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+delay;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

  s+=`<rect x="-20" y="-20" width="1640" height="700" fill="url(#sky)"/><rect x="-20" y="-20" width="1640" height="700" fill="url(#hS)"/>`;

    s+=`<g transform="translate(${x} ${y}) scale(${k})" fill="#fff" stroke="#8fb0c2" stroke-width="3" opacity=".95"><ellipse cx="0" cy="0" rx="90" ry="34"/><ellipse cx="-50" cy="12" rx="55" ry="26"/><ellipse cx="55" cy="10" rx="62" ry="28"/><ellipse cx="10" cy="-20" rx="48" ry="26"/></g>`;
  });
  // 遠山
  s+=`<path d="M-20 560 Q200 430 430 520 T860 500 T1260 520 T1640 450 V700 H-20Z" fill="#a9d99a"/><path d="M-20 560 Q200 430 430 520 T860 500 T1260 520 T1640 450 V700 H-20Z" fill="url(#hG2)"/>`;
  // 雲霄飛車
  const segs=[[[420,610],[480,240],[610,240],[665,560]],[[665,560],[705,380],[790,380],[840,560]],[[840,560],[870,470],[930,440],[980,610]]];
  let d='M420 610';segs.forEach(g=>d+=` C${g[1]} ${g[2]} ${g[3]}`);
  segs.forEach(g=>{for(let t=0.05;t<1;t+=.16){const[x,y]=bez(g,t);s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="660" stroke="#8a5a34" stroke-width="5"/>`}});
  s+=`<path d="${d}" fill="none" stroke="#7a3f22" stroke-width="9"/><path d="${d}" transform="translate(0 14)" fill="none" stroke="#c0392b" stroke-width="5"/>`;
  // 摩天輪
  const cx=1180,cy=370,R=205,cols=['#e74c3c','#f2b134','#3fa2d9','#5cb85c','#b565d9','#ff8fab'];
  s+=`<line x1="${cx}" y1="${cy}" x2="${cx-130}" y2="660" stroke="#7a5230" stroke-width="12"/><line x1="${cx}" y1="${cy}" x2="${cx+130}" y2="660" stroke="#7a5230" stroke-width="12"/><line x1="${cx-100}" y1="560" x2="${cx+100}" y2="560" stroke="#7a5230" stroke-width="6"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#d6453d" stroke-width="9"/><circle cx="${cx}" cy="${cy}" r="${R-38}" fill="none" stroke="#f2b134" stroke-width="5"/>`;
  for(let i=0;i<12;i++){const a=i*Math.PI/6,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
    s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e8e0cc" stroke-width="4"/><line x1="${x}" y1="${y}" x2="${x}" y2="${y+16}" stroke="#555" stroke-width="2"/><rect x="${x-17}" y="${y+14}" width="34" height="28" rx="8" fill="${cols[i%6]}" stroke="#5a3d1c" stroke-width="3"/>`;}
  s+=`<circle cx="${cx}" cy="${cy}" r="16" fill="#f2b134" stroke="#5a3d1c" stroke-width="4"/>`;
  // 旋轉木馬
  const kx=230,ky=560;
  for(let i=0;i<6;i++){const x1=kx-90+i*30;s+=`<polygon points="${kx},${ky-175} ${x1},${ky-95} ${x1+30},${ky-95}" fill="${i%2?'#fff':'#e04b3f'}" stroke="#7a3f22" stroke-width="2"/>`}
  s+=`<line x1="${kx}" y1="${ky-175}" x2="${kx}" y2="${ky-215}" stroke="#555" stroke-width="3"/><polygon points="${kx},${ky-215} ${kx+34},${ky-205} ${kx},${ky-195}" fill="#f2b134"/>`;
  for(let i=0;i<5;i++){const x=kx-80+i*40;s+=`<line x1="${x}" y1="${ky-95}" x2="${x}" y2="${ky}" stroke="#d9a21b" stroke-width="7"/>`}
  s+=`<rect x="${kx-100}" y="${ky}" width="200" height="30" rx="8" fill="#b9824f" stroke="#6b4f2a" stroke-width="3"/><rect x="${kx-100}" y="${ky}" width="200" height="30" fill="url(#hD)"/>`;
  // 樹
  const tree=(x,y,k)=>{s+=`<g transform="translate(${x} ${y}) scale(${k})"><rect x="-12" y="-10" width="24" height="90" fill="#8a5a34"/><rect x="-12" y="-10" width="24" height="90" fill="url(#hD)"/><ellipse cx="0" cy="-50" rx="80" ry="70" fill="#5fb55a"/><ellipse cx="-45" cy="-10" rx="55" ry="45" fill="#4fa34e"/><ellipse cx="48" cy="-8" rx="55" ry="45" fill="#5fb55a"/><ellipse cx="0" cy="-50" rx="80" ry="70" fill="url(#hG)"/><ellipse cx="-45" cy="-10" rx="55" ry="45" fill="url(#hG2)"/></g>`};
  tree(80,590,1);tree(1500,600,1.1);tree(1000,610,.7);tree(420,625,.6);
  // 地面
  s+=`<rect x="-20" y="640" width="1640" height="280" fill="url(#grassG)"/><rect x="-20" y="640" width="1640" height="280" fill="url(#hG)"/>`;
  s+=`<polygon points="660,900 940,900 860,640 740,640" fill="#ecd9a6"/><polygon points="660,900 940,900 860,640 740,640" fill="url(#hD)"/>`;
  for(let x=0;x<1600;x+=34){s+=`<rect x="${x}" y="648" width="14" height="44" fill="#fff" stroke="#9a8a6a" stroke-width="2"/>`}
  s+=`<line x1="0" y1="662" x2="1600" y2="662" stroke="#9a8a6a" stroke-width="4"/><line x1="0" y1="680" x2="1600" y2="680" stroke="#9a8a6a" stroke-width="4"/>`;
  // 花
  const fc=['#ff6f91','#ffd23f','#ffffff','#b565d9'];
  for(let i=0;i<46;i++){const x=(i*173)%1600,y=720+((i*61)%160);s+=`<circle cx="${x}" cy="${y}" r="6" fill="${fc[i%4]}" stroke="#6b4f2a" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="2" fill="#f2b134"/>`}
  // 氣球
  [[110,260,'#e74c3c'],[160,230,'#3fa2d9'],[135,300,'#f2b134'],[1400,300,'#b565d9'],[1450,260,'#ff8fab'],[1370,250,'#5cb85c']].forEach(([x,y,c])=>{
    s+=`<line x1="${x}" y1="${y+34}" x2="${x+(x<800?20:-20)}" y2="${y+130}" stroke="#666" stroke-width="2"/><ellipse cx="${x}" cy="${y}" rx="28" ry="36" fill="${c}" stroke="#5a3d1c" stroke-width="2.5" opacity=".92"/><ellipse cx="${x-9}" cy="${y-12}" rx="6" ry="10" fill="#fff" opacity=".55"/>`;});
  s+=`</g><rect width="1600" height="900" filter="url(#grain)" style="mix-blend-mode:multiply"/></svg>`;
  $('#bg').innerHTML=s;
}

/* ===================== 水彩風小貓、小狗 ===================== */
function avatarSVG(kind){
  const dog=kind==='dog';
  const fur=dog?'#dba35f':'#f3a85c', dark=dog?'#8b5a2b':'#c9702b', coll=dog?'#4f9be0':'#e0485f';
  let body=`
  <g filter="url(#water)">
    <ellipse cx="100" cy="188" rx="58" ry="40" fill="${fur}" opacity=".85"/>
    <ellipse cx="104" cy="190" rx="52" ry="36" fill="${fur}" opacity=".5"/>
    <ellipse cx="100" cy="195" rx="30" ry="28" fill="#fff6e2" opacity=".85"/>
    ${dog
      ?`<ellipse cx="38" cy="104" rx="21" ry="44" transform="rotate(14 38 104)" fill="${dark}" opacity=".9"/><ellipse cx="162" cy="104" rx="21" ry="44" transform="rotate(-14 162 104)" fill="${dark}" opacity=".9"/>`
      :`<polygon points="38,76 46,18 92,56" fill="${fur}"/><polygon points="162,76 154,18 108,56" fill="${fur}"/><polygon points="50,62 53,34 76,54" fill="#ffb3bd" opacity=".9"/><polygon points="150,62 147,34 124,54" fill="#ffb3bd" opacity=".9"/>`}
    <ellipse cx="100" cy="110" rx="68" ry="60" fill="${fur}" opacity=".9"/>
    <ellipse cx="97" cy="108" rx="64" ry="56" fill="${fur}" opacity=".55"/>
    ${dog
      ?`<ellipse cx="100" cy="136" rx="34" ry="25" fill="#fff3dc" opacity=".95"/><ellipse cx="100" cy="76" rx="14" ry="20" fill="${dark}" opacity=".35"/>`
      :`<ellipse cx="100" cy="136" rx="26" ry="18" fill="#fff3dc" opacity=".95"/><path d="M100 54 v16 M86 58 l4 12 M114 58 l-4 12" stroke="${dark}" stroke-width="5" stroke-linecap="round" fill="none" opacity=".7"/>`}
    <path d="M66 164 Q100 184 134 164" stroke="${coll}" stroke-width="12" fill="none" stroke-linecap="round" opacity=".9"/>
    <circle cx="100" cy="178" r="6" fill="#ffd54a" stroke="#b88a2a" stroke-width="1.5"/>
  </g>
  <g filter="url(#waterLite)" fill="none">
    <ellipse cx="100" cy="110" rx="68" ry="60" stroke="${dark}" stroke-width="2.5" opacity=".45"/>
    <ellipse cx="54" cy="130" rx="13" ry="8" fill="#ff8f9c" stroke="none" opacity=".45"/><ellipse cx="146" cy="130" rx="13" ry="8" fill="#ff8f9c" stroke="none" opacity=".45"/>
    ${dog
      ?`<ellipse cx="100" cy="122" rx="12" ry="8" fill="#3a2a22" stroke="none"/><ellipse cx="96" cy="120" rx="3" ry="2" fill="#fff" stroke="none" opacity=".7"/>`
      :`<path d="M92 122 h16 l-8 9 z" fill="#ff8fa3" stroke="#c0536a" stroke-width="1.5"/><path d="M60 134 l-30 -6 M60 140 l-32 4 M140 134 l30 -6 M140 140 l32 4" stroke="#6b4a2b" stroke-width="2"/>`}
    <g class="e-open" fill="#2a1d17" stroke="none"><circle cx="72" cy="104" r="10"/><circle cx="128" cy="104" r="10"/><circle cx="75" cy="100" r="3.5" fill="#fff"/><circle cx="131" cy="100" r="3.5" fill="#fff"/></g>
    <g class="e-happy" stroke="#2a1d17" stroke-width="5" stroke-linecap="round"><path d="M60 108 q12 -14 24 0"/><path d="M116 108 q12 -14 24 0"/></g>
    <g class="e-sad"><g fill="#2a1d17" stroke="none"><circle cx="72" cy="108" r="10"/><circle cx="128" cy="108" r="10"/><circle cx="76" cy="105" r="4.5" fill="#fff"/><circle cx="132" cy="105" r="4.5" fill="#fff"/></g>
      <path d="M58 88 l26 10 M142 88 l-26 10" stroke="#2a1d17" stroke-width="4.5" stroke-linecap="round"/>
      <g fill="#8cc7ff" stroke="none"><ellipse class="tear" cx="66" cy="124" rx="4" ry="7"/><ellipse class="tear" cx="134" cy="124" rx="4" ry="7" style="animation-delay:.5s"/></g></g>
    <path class="m-smile" d="M100 131 q-9 12 -22 4 M100 131 q9 12 22 4" stroke="#3a2a22" stroke-width="3.5" stroke-linecap="round"/>
    <g class="m-open"><path d="M80 136 q20 32 40 0 z" fill="#7a2f2f" stroke="#3a2a22" stroke-width="3"/><ellipse cx="100" cy="150" rx="11" ry="7" fill="#ff8fa3" stroke="none"/></g>
    <path class="m-sad" d="M82 148 q18 -16 36 0" stroke="#3a2a22" stroke-width="3.5" stroke-linecap="round"/>
  </g>`;
  return `<svg class="av" data-s="normal" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}
function setAv(p,state,ms){
  const box=$('#av-'+p), svg=box.querySelector('svg');
  clearTimeout(avT[p]); svg.dataset.s=state;
  box.className='avatar'+(state==='normal'?'':' '+state);
  if(ms) avT[p]=setTimeout(()=>setAv(p,'normal'),ms);
}

/* ===================== 煙火 ===================== */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],run=false,DPR=1;
function fit(){DPR=window.devicePixelRatio||1;cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',fit);fit();
function burst(x,y){
  const hue=Math.random()*360;
  for(let i=0;i<80;i++){const a=Math.random()*6.283,sp=1.5+Math.random()*6;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,hue:hue+Math.random()*40,r:2+Math.random()*2});}
  if(!run){run=true;requestAnimationFrame(loop)}
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);cx.globalCompositeOperation='lighter';
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.vx*=.985;p.life-=.012;
    cx.fillStyle=`hsla(${p.hue},95%,60%,${Math.max(p.life,0)})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();});
  if(parts.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,innerWidth,innerHeight)}
}
function celebrate(n=7){
  for(let i=0;i<n;i++)setTimeout(()=>burst(innerWidth*(.12+Math.random()*.76),innerHeight*(.12+Math.random()*.45)),i*260);
}

/* ===================== 題庫準備（圖片檢查）===================== */
const imgOK=f=>new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);i.src=IMG_DIR+f});
async function prepare(){
  let skipped=0,withImg=0;pool=[];
  for(const q of ALL){
    const files=[q.img,...(q.optImgs||[])].filter(Boolean);
    let ok=true;for(const f of files){if(!(await imgOK(f))){ok=false;break}}
    if(ok){pool.push(q);if(files.length)withImg++}else skipped++;
  }
  const n=Math.min(TOTAL_Q,pool.length);
  $('#bankInfo').textContent=`題庫可用 ${pool.length} 題（含圖題 ${withImg} 題）${skipped?`；${skipped} 題因缺少圖片檔暫時略過`:''}；本局隨機 ${n} 題`;
  $('#startBtn').disabled=pool.length===0;
}

/* ===================== 遊戲流程 ===================== */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function show(id){['start','game','end'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
function setStatus(t,c=''){const e=$('#status');e.textContent=t;e.className='status '+c}

function newGame(){
  list=shuffle(pool).slice(0,Math.min(TOTAL_Q,pool.length));
  idx=0;score.dog=score.cat=0;
  ['dog','cat'].forEach(p=>{$('#sc-'+p).textContent=0;setAv(p,'normal')});
  $('#qt').textContent=list.length;
  show('game');nextQuestion(true);
}

function nextQuestion(initial){
  if(!initial)idx++;
  if(idx>=list.length){return showEnd()}
  cur=list[idx];st='waiting';first=null;turn=null;wrongSet.clear();
  $('#qn').textContent=idx+1;
  $('#qtext').textContent=cur.q;
  const qi=$('#qimg');
  if(cur.img){qi.src=IMG_DIR+cur.img;qi.classList.remove('hidden')}else{qi.classList.add('hidden');qi.removeAttribute('src')}
  const box=$('#opts');box.innerHTML='';box.classList.add('locked');
  for(let i=0;i<4;i++){
    const b=document.createElement('button');b.className='opt';b.dataset.i=i;
    let inner=`<b>${LET[i]}</b>`;
    if(cur.optImgs)inner+=`<img src="${IMG_DIR+cur.optImgs[i]}" alt="選項${LET[i]}">`;
    else if(cur.o)inner+=`<span></span>`;
    b.innerHTML=inner;
    if(cur.o&&!cur.optImgs)b.querySelector('span').textContent=cur.o[i];
    b.addEventListener('pointerdown',e=>{e.preventDefault();choose(i)});
    box.appendChild(b);
  }
  $('#hint').classList.add('hidden');$('#nextBtn').classList.add('hidden');
  ['dog','cat'].forEach(p=>{$('#bz-'+p).disabled=false;$('#pl-'+p).classList.remove('turn','dim')});
  setStatus('📣 搶答開始！先按「搶答」的人才能作答');
  startTimer();
}

function startTimer(){
  clearInterval(tid);deadline=Date.now()+TIME*1000;tick();tid=setInterval(tick,100);
}
function tick(){
  const left=Math.max(0,(deadline-Date.now())/1000);
  $('#timerNum').textContent='⏱ '+Math.ceil(left);
  $('#barI').style.width=(left/TIME*100)+'%';
  $('#timer').classList.toggle('warn',left<=15);
  if(left<=0)timeUp();
}
const stopTimer=()=>{clearInterval(tid);tid=null};

function timeUp(){
  if(st==='reveal')return;
  stopTimer();
  if(st==='waiting')setStatus('⏰ 時間到！兩位都沒有作答，各 0 分','bad');
  else setStatus(`⏰ 時間到！${NAME[turn]}沒有及時作答，不加不扣分`,'bad');
  reveal();
}

function buzz(p){
  if(st!=='waiting')return;
  sBuzz();st='answering';first=p;turn=p;
  ['dog','cat'].forEach(x=>{$('#bz-'+x).disabled=true});
  $('#pl-'+p).classList.add('turn');$('#pl-'+other(p)).classList.add('dim');
  $('#opts').classList.remove('locked');
  setStatus(`🔔 ${NAME[p]}搶到答題權！請選擇答案`);
}

function addScore(p,d){
  score[p]+=d;const el=$('#sc-'+p);el.textContent=score[p];
  el.parentElement.classList.add('pop');setTimeout(()=>el.parentElement.classList.remove('pop'),250);
  const f=document.createElement('div');f.className='float '+(d>0?'plus':'minus');f.textContent=(d>0?'+':'−')+Math.abs(d);
  $('#pl-'+p).appendChild(f);setTimeout(()=>f.remove(),1300);
}

function choose(i){
  if((st!=='answering'&&st!=='second')||wrongSet.has(i))return;
  const p=turn,btns=$('#opts').children;
  if(i===cur.a){
    stopTimer();addScore(p,1);sOK();celebrate(7);
    setAv(p,'win',3800);
    setStatus(`🎉 ${NAME[p]}答對了！+1 分`,'good');
    reveal();
  }else{
    addScore(p,-1);sBad();setAv(p,'sad',2800);
    wrongSet.add(i);btns[i].classList.add('wrong');
    if(st==='answering'){
      st='second';turn=other(p);
      $('#hint').textContent='💡 提示：'+cur.h;$('#hint').classList.remove('hidden');
      $('#pl-'+p).classList.remove('turn');$('#pl-'+p).classList.add('dim');
      $('#pl-'+turn).classList.remove('dim');$('#pl-'+turn).classList.add('turn');
      setStatus(`😢 ${NAME[p]}答錯了，−1 分！換${NAME[turn]}作答`,'bad');
    }else{
      stopTimer();
      setStatus(`😢 ${NAME[p]}也答錯了，−1 分！`,'bad');
      reveal();
    }
  }
}

function reveal(){
  st='reveal';
  const btns=$('#opts').children;
  $('#opts').classList.remove('locked');
  btns[cur.a].classList.add('correct');
  [...btns].forEach(b=>b.style.pointerEvents='none');
  ['dog','cat'].forEach(p=>{$('#bz-'+p).disabled=true;$('#pl-'+p).classList.remove('turn','dim')});
  const nb=$('#nextBtn');nb.textContent=(idx>=list.length-1)?'看成績 🏆':'下一題 ▶';nb.classList.remove('hidden');
}

/* ===================== 結算 ===================== */
function showEnd(){
  stopTimer();show('end');
  ['dog','cat'].forEach(p=>{$('#av-e-'+p).innerHTML=avatarSVG(p);$('#fs-'+p).textContent=score[p]});
  const sc=$('#scroll');sc.classList.remove('open');$('#tapHint').style.display='';
  $('#pc').innerHTML='';
}
function openScroll(){
  const sc=$('#scroll');if(sc.classList.contains('open'))return;
  const d=score.dog,c=score.cat;
  let html='';
  const av=p=>`<div class="avatar win" style="margin:14px auto 6px">${avatarSVG(p).replace('data-s="normal"','data-s="win"')}</div>`;
  if(d===c){
    html=`<div class="crown">🤝</div><div style="display:flex;justify-content:center;gap:26px">${av('dog')}${av('cat')}</div><div class="wname">平手！兩位都是贏家</div><div>各 ${d} 分</div>`;
  }else{
    const w=d>c?'dog':'cat';
    html=`<div class="crown">👑</div>${av(w)}<div class="wname">${w==='dog'?'🐶':'🐱'} ${NAME[w]} 獲勝！</div><div>${score[w]} 分 ／ 對手 ${score[other(w)]} 分</div>`;
  }
  html+=`<div class="congrats">恭喜~請去找老師領取獎勵</div>`;
  $('#pc').innerHTML=html;
  sc.classList.add('open');$('#tapHint').style.display='none';
  sOK();celebrate(10);setTimeout(()=>celebrate(6),2600);
}

/* ===================== 事件 ===================== */
buildScene();
['dog','cat'].forEach(p=>{
  $('#av-'+p).innerHTML=avatarSVG(p);
  $('#av-s-'+p).innerHTML=avatarSVG(p);
  $('#bz-'+p).addEventListener('pointerdown',e=>{e.preventDefault();buzz(p)});
});
$('#startBtn').addEventListener('click',()=>{tone(1,.01);newGame()});
$('#nextBtn').addEventListener('click',()=>nextQuestion());
$('#scroll').addEventListener('click',openScroll);
$('#againBtn').addEventListener('click',()=>{if(pool.length)newGame()});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='a')buzz('dog');else if(k==='l')buzz('cat');
});
document.addEventListener('contextmenu',e=>e.preventDefault());
prepare();
</script>
